get_messages:
  name: Get messages
  description: Return every current WiBi message and its direct-answer replies, including plain-text content for TTS.

download_attachments:
  name: Download attachments
  description: Download message attachments into the private wibi_attachments configuration folder. Returns local files for actions such as Telegram send document. Does not acknowledge the message.
  fields:
    message_id:
      name: Message ID
      description: The original message ID from Get messages or a wibi_new_message event. Reply IDs are not supported.
      required: true
      selector:
        text:
    file_name:
      name: File name
      description: Optional exact WiBi attachment filename. Omit to download all attachments.
      selector:
        text:

confirm_message:
  name: Confirm message
  description: Acknowledge a WiBi message as the signed-in user. This changes the message in WiBi.
  fields:
    message_id:
      name: Message ID
      description: The ID exposed by the WiBi Messages sensor or Get messages action.
      required: true
      example: "12345678-1234-1234-1234-123456789abc"
      selector:
        text:

confirm_last_message:
  name: Confirm last message
  description: Acknowledge the newest incoming WiBi message without requiring its ID. This changes the message in WiBi.

get_calendar_events:
  name: Get calendar events for reminders
  description: Return expanded Google Calendar occurrences with event IDs and descriptions for AI reminder proposals. Requires an existing writable Google Calendar connection.
  fields:
    entity_id:
      name: Calendar
      required: true
      selector:
        entity:
          filter:
            - domain: calendar
              integration: google
    start_date_time:
      name: Start time
      description: ISO 8601 timestamp with UTC offset.
      required: true
      selector:
        text:
    end_date_time:
      name: End time
      description: Exclusive end of the time range, with UTC offset.
      required: true
      selector:
        text:

append_calendar_reminder:
  name: Append calendar reminder
  description: Append a WiBi reminder to one future Google Calendar occurrence after checking its start and existing description. Never edits an entire repeating series.
  fields:
    entity_id:
      name: Calendar
      required: true
      selector:
        entity:
          filter:
            - domain: calendar
              integration: google
    event_id:
      name: Event occurrence ID
      description: Exact event_id returned by Get calendar events for reminders, not the recurring series ID.
      required: true
      selector:
        text:
    expected_start:
      name: Expected start
      description: The occurrence start from the calendar snapshot, with UTC offset.
      required: true
      selector:
        text:
    expected_description:
      name: Expected description
      description: Original description from the calendar snapshot; use an empty string if there was none.
      required: true
      selector:
        text:
          multiline: true
    reminder:
      name: Reminder to append
      required: true
      selector:
        text:
          multiline: true
